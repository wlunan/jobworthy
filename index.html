<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>JobWorthy - 求职职位管理系统</title>
<link rel="stylesheet" href="assets/index.css">
  <link rel="stylesheet" href="assets/ui.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="top-bar">
<div style="display:flex;align-items:center"><h1><i data-lucide="radar" aria-hidden="true"></i> JobWorthy - 职得 <span style="font-size:12px;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:999px;font-weight:600;vertical-align:middle">v2.4.2</span></h1><nav class="top-nav"><a class="active" href="index.html">招聘机会</a><a href="applications.html">我的投递</a></nav></div>
  <div class="header-actions">
  <button class="btn btn-d" onclick="clearAll()"><i data-lucide="trash-2" aria-hidden="true"></i> 清空</button>
  <a class="gh-link" href="https://github.com/wlunan/jobworthy" target="_blank" rel="noopener noreferrer" title="GitHub 开源仓库" aria-label="GitHub 开源仓库"><svg viewBox="0 0 16 16" width="18" height="18" fill="#24292f" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </div>
</div>
<div class="toolbar">
<div class="search-field"><i data-lucide="search" aria-hidden="true"></i><select class="s-select" id="searchField" onchange="onSearchFieldChange()" title="选择要搜索的字段"><option value="">全部字段</option><option value="c">公司</option><option value="p">职位</option><option value="l">地点</option><option value="ind">行业</option><option value="w">批次</option><option value="s">来源</option></select><input type="text" class="s-input" id="searchInput" placeholder="搜索公司、职位、地点或关键词（如：北京 / Java）" oninput="filterData()"></div>
<select class="select" id="indFilter" onchange="filterData()" style="width:150px">
<option value="">全部行业</option>
<option value="互联网科技">互联网科技</option>
<option value="银行金融">银行金融</option>
<option value="证券基金">证券基金</option>
<option value="通信运营商">通信运营商</option>
<option value="能源电力">能源电力</option>
<option value="石油化工">石油化工</option>
<option value="汽车制造">汽车制造</option>
<option value="装备重工">装备重工</option>
<option value="建筑地产">建筑地产</option>
<option value="航天军工">航天军工</option>
<option value="医药医疗">医药医疗</option>
<option value="快消零售">快消零售</option>
<option value="农业食品">农业食品</option>
<option value="交通物流">交通物流</option>
<option value="综合">综合</option>
</select>
<select class="select" id="srcFilter" onchange="filterData()">
<option value="">全部来源</option>
<option value="互联网">互联网大厂</option>
<option value="央企">央企国企</option>
<option value="综合">综合招聘</option>
<option value="其他">其他</option>
</select>
<!-- 数据源筛选：当前仅有聚合表格数据（默认），后续接入其他表格岗位数据时在此追加 option -->
<select class="select" id="dsFilter" onchange="filterData()"><option value="">全部数据源</option><option value="校招信息聚合平台">校招信息聚合平台</option></select>
<input type="text" class="select" id="batchFilter" placeholder="批次筛选" oninput="filterData()" style="width:120px">
<select class="select" id="updatedFilter" onchange="filterData()"><option value="">全部更新时间</option><option value="1">最近1天</option><option value="3">最近3天</option><option value="7">最近7天</option><option value="30">最近30天</option></select>
<select class="select" id="linkFilter" onchange="filterData()"><option value="">全部链接</option><option value="official">有官方公告</option><option value="apply">有投递链接</option><option value="both">公告和投递均有</option></select>
<button class="btn btn-p compact-btn" type="button" onclick="clearFilters()"><i data-lucide="filter-x" aria-hidden="true"></i> 清空筛选</button>
<select class="select" id="sortSelect" onchange="changeSort(this.value)"><option value="updated_desc">更新时间：新到旧</option><option value="updated_asc">更新时间：旧到新</option><option value="deadline_asc">截止日期：近到远</option><option value="deadline_desc">截止日期：远到近</option><option value="company_asc">公司名称：A-Z</option><option value="batch_asc">批次名称</option></select>
<span class="stats" id="stats">共 0 条记录</span>
</div>
<div class="hero-banner" id="heroBanner">
  <div class="hero-body">
    <span class="hero-title">覆盖 856 家企业校招节点，每日自动聚合，筛选后一键直达投递</span>
    <span class="hero-meta" id="heroUpdated"></span>
  </div>
  <button class="hero-close" onclick="dismissHero()" aria-label="关闭横幅">×</button>
</div>
<details class="quick-guide">
  <summary><i data-lucide="book-open" aria-hidden="true"></i><span>使用指南</span><span class="guide-summary">数据每日同步，支持筛选和投递管理</span><i class="guide-chevron" data-lucide="chevron-down" aria-hidden="true"></i></summary>
  <div class="guide-content">
    <div><span class="guide-step">01</span><strong>浏览最新数据</strong><p>页面读取同步后的岗位表，无需配置密钥。</p></div>
    <div><span class="guide-step">02</span><strong>按条件筛选</strong><p>可按行业、地点、批次、更新时间和链接筛选。</p></div>
    <div><span class="guide-step">03</span><strong>跟进岗位</strong><p>将感兴趣的岗位加入投递管理，集中记录进度。</p></div>
  </div>
</details>
<div id="empty"><div class="icon"><i data-lucide="inbox" aria-hidden="true"></i></div><h3>还没有数据</h3><p id="emptyHint">暂未读取到已同步的岗位数据，请稍后刷新页面。</p></div>
<div class="table-wrap"><table id="dataTable" style="display:none">
<thead><tr><th style="width:44px">#</th><th>公司</th><th>职位 / 标题</th><th>行业</th><th>更新时间</th><th>批次</th><th>地点</th><th>截止日期</th><th>官方公告</th><th>投递链接</th><th>来源</th><th>投递管理</th></tr></thead>
<tbody id="tbody"></tbody>
</table></div>
<div id="pagination" style="display:none">
<button class="btn btn-p" onclick="changePage(-1)"><i data-lucide="chevron-left" aria-hidden="true"></i> 上一页</button>
<span id="pageInfo"></span>
<button class="btn btn-p" onclick="changePage(1)">下一页 <i data-lucide="chevron-right" aria-hidden="true"></i></button>
<select class="select" id="pageSizeSelect" style="margin-left:12px;width:auto" onchange="changePageSize(this.value)">
<option value="20">20条/页</option>
<option value="50">50条/页</option>
<option value="100">100条/页</option>
</select>
</div>
<script src="https://unpkg.com/lucide@0.525.0/dist/umd/lucide.min.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
